<div class="status-container">

  <h5 class="modal-title">
    Update Leave Status
  </h5>

  <div class="form-group mt-3">

    <label for="status">
      Status
    </label>

    <select
      id="status"
      class="form-control"
      [(ngModel)]="status">

      <option
        *ngFor="let item of statusList"
        [ngValue]="item.id">

        {{ item.name }}

      </option>

    </select>

  </div>

  <div class="text-right mt-4">

    <button
      type="button"
      class="btn btn-primary"
      (click)="save()">

      Save

    </button>

  </div>

</div>
